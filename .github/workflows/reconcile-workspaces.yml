name: Reconcile ephemeral workspaces

on:
  workflow_call:
    inputs:
      pull_request_number:
        description: "Pull request to comment the result on. Omit to skip commenting."
        required: false
        type: string
        default: ""
    secrets:
      TF_API_TOKEN:
        description: "HCP Terraform team token, scoped to managing workspaces in the Canary project."
        required: true

permissions: {}

jobs:
  reconcile-ephemeral-workspaces:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    # Keyed on the workspace rather than the pull request. Every pull request
    # reconciles the same shared list of workspaces, so a new PR is created
    # concurrently with another PR's reconciliation, a lost update could occur.
    concurrency:
      group: workspace-manager
      cancel-in-progress: false

    env:
      TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
      TF_CLOUD_ORGANIZATION: "${{ vars.TF_CLOUD_ORGANIZATION }}"
      PULL_REQUEST_COUNT_FILE: "terraform-workspaces/pull-requests.auto.tfvars"

    steps:
      - uses: actions/checkout@v7

      # `*.auto.tfvars` is loaded automatically by Terraform and the upload step
      # packages the whole directory, so the value travels with the configuration
      # version. jq emits a JSON array of strings, which is also valid HCL.
      - name: Collect open pull request numbers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf 'pull_request_numbers = %s\n' \
            "$(gh pr list --state open --json number --jq '[.[].number | tostring]')" \
            > $PULL_REQUEST_COUNT_FILE
          cat $PULL_REQUEST_COUNT_FILE

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: reconcile-upload
        with:
          workspace: ${{ vars.TF_WORKSPACE_MANAGER }}
          directory: ${{ vars.TF_DIRECTORY_WORKSPACES }}

      - name: Create apply run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: reconcile-run
        with:
          workspace: ${{ vars.TF_WORKSPACE_MANAGER }}
          configuration_version: ${{ steps.reconcile-upload.outputs.configuration_version_id }}

      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        if: fromJSON(steps.reconcile-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: reconcile-apply
        with:
          run: ${{ steps.reconcile-run.outputs.run_id }}

      - name: Update PR
        uses: actions/github-script@v9
        if: always() && inputs.pull_request_number != ''
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
          CONCLUSION: ${{ steps.reconcile-apply.conclusion }}
          RUN_LINK: ${{ steps.reconcile-run.outputs.run_link }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = [
              `#### HCP Terraform workspace reconciliation: ${process.env.CONCLUSION}`,
              `[HCP Terraform Apply](${process.env.RUN_LINK})`,
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
