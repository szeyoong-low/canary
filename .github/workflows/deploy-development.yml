name: Deploy to development
# Adapted from https://developer.hashicorp.com/terraform/tutorials/automation/github-actions

on:
  pull_request:
    branches:
      - main

permissions: {}

env:
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_CLOUD_ORGANIZATION: "${{ vars.TF_CLOUD_ORGANIZATION }}"
  BOT_NAME: Bot
  PR_NUMBER: "${{ github.event.pull_request.number }}"
  TF_WORKSPACE_DEVELOPMENT_PR: "${{ vars.TF_WORKSPACE_DEV_PREFIX }}${{ github.event.pull_request.number }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}

jobs:
  reconcile-ephemeral-workspaces:
    permissions:
      contents: read
      pull-requests: write

    uses: ./.github/workflows/reconcile-workspaces.yml
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    with:
      pull_request_number: ${{ github.event.pull_request.number }}

  # Builds and pushes the image, then reports the tag it used. Called rather than
  # left to trigger itself, so that the image is in ECR before the task definition
  # below names it.
  backend:
    permissions:
      contents: read

      # A reusable workflow can never hold more than the job that calls it grants.
      id-token: write

    uses: ./.github/workflows/backend.yml
    secrets:
      ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
      AWS_ECR_ROLE_ARN: ${{ secrets.AWS_ECR_ROLE_ARN }}
      RAILWAY_PREVIEW_TOKEN: ${{ secrets.RAILWAY_PREVIEW_TOKEN }}

  deploy-development-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    needs:
      - reconcile-ephemeral-workspaces
      - backend

    # The build is skipped for pull requests from forks, which hold no secrets
    # and so cannot assume the push role. Its output is then empty, which would
    # otherwise pin the task definition to a tag that does not exist.
    if: needs.backend.outputs.image-tag != ''

    steps:
      - uses: actions/checkout@v7

      # `*.auto.tfvars` is loaded automatically by Terraform and the upload step
      # packages the whole directory, so the value travels with the configuration
      # version. The run itself executes in HCP, so nothing set in this runner's
      # environment would otherwise reach it.
      #
      # Safe here only because a commit SHA is not a secret: a configuration
      # version can be downloaded by anyone with read access to the workspace.
      - name: Pin image for task definition
        env:
          IMAGE_TAG: "${{ needs.backend.outputs.image-tag }}"
          IMAGE_TAG_FILE: "${{ vars.TF_DIRECTORY_INFRASTRUCTURE }}/image-tag.auto.tfvars"
        run: |
          printf 'image_tag = "%s"\n' "$IMAGE_TAG" > "$IMAGE_TAG_FILE"
          cat "$IMAGE_TAG_FILE"

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: apply-upload
        with:
          workspace: ${{ env.TF_WORKSPACE_DEVELOPMENT_PR }}
          directory: ${{ vars.TF_DIRECTORY_INFRASTRUCTURE }}

      - name: Create apply run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: apply-run
        with:
          workspace: ${{ env.TF_WORKSPACE_DEVELOPMENT_PR }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}

      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}

      - name: Update PR
        uses: actions/github-script@v9
        id: plan-comment
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          CONCLUSION: ${{ steps.apply.conclusion }}
          RUN_LINK: ${{ steps.apply-run.outputs.run_link }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = [
              `#### HCP Terraform Plan application to Development: ${process.env.CONCLUSION}`,
              `[HCP Terraform Apply](${process.env.RUN_LINK})`,
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
