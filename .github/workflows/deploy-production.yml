name: Deploy to production
# Adapted from https://developer.hashicorp.com/terraform/tutorials/automation/github-actions

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

env:
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_CLOUD_ORGANIZATION: "${{ vars.TF_CLOUD_ORGANIZATION }}"

concurrency:
  group: ${{ vars.TF_WORKSPACE_PRODUCTION }}
  queue: max

jobs:
  promote-backend-artifact:
    # Forks never receive secrets or an OIDC token, so the promotion would fail
    # rather than be denied. Skipping keeps the run green and the reason
    # explicit. `head.repo` reads as null once a deleted fork is garbage
    # collected, which compares false and therefore also skips.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    # No checkout: this job only makes registry API calls, so it needs no
    # repository contents and no Docker daemon.
    permissions:
      id-token: write

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY_NAME: ${{ secrets.ECR_REPOSITORY_NAME }}
      DEVELOPMENT_TAG: "dev-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}"
      RELEASE_TAG: "release-${{ github.event.pull_request.head.sha }}"
      TF_API_TOKEN: "" # Masks the workflow-level value, which this job has no use for.

    steps:
      - name: Assume AWS image publishing role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: "${{ secrets.AWS_ECR_ROLE_ARN }}"
          aws-region: "${{ env.AWS_REGION }}"

      - name: Retag promoted image
        run: |
          # This job deletes its own input on success, so a re-run finds no
          # development tag to read. The release tag is therefore what records
          # that the work is done, and it is checked before anything else.
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$RELEASE_TAG" > /dev/null 2>&1; then
            echo "$RELEASE_TAG is already in the registry. Nothing to promote."
            exit 0
          fi

          # Buildx writes an OCI manifest, but batch-get-image accepts only the
          # Docker media types unless told otherwise, and reports a failure
          # rather than an image when the type is not accepted.
          image="$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$DEVELOPMENT_TAG" \
            --accepted-media-types \
              "application/vnd.oci.image.manifest.v1+json" \
              "application/vnd.oci.image.index.v1+json" \
              "application/vnd.docker.distribution.manifest.v2+json" \
              "application/vnd.docker.distribution.manifest.list.v2+json" \
            --output json)"

          if [ "$(jq '.images | length' <<< "$image")" -eq 0 ]; then
            echo "No image is tagged $DEVELOPMENT_TAG." >&2
            jq '.failures' <<< "$image" >&2
            exit 1
          fi

          manifest="$(jq --raw-output '.images[0].imageManifest' <<< "$image")"
          media_type="$(jq --raw-output '.images[0].imageManifestMediaType' <<< "$image")"

          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-tag "$RELEASE_TAG" \
            --image-manifest "$manifest" \
            --image-manifest-media-type "$media_type" > /dev/null

          echo "Promoted $DEVELOPMENT_TAG to $RELEASE_TAG."

      # The manifest survives under its release tag; only the pointer goes.
      # This is what leaves `release-*` as the only thing the lifecycle policy's
      # rollback rule counts.
      #
      # batch-delete-image reports a missing tag in its `failures` array rather
      # than exiting non-zero, so this is safe on the re-run path where the
      # promotion above short-circuited and the tag is already gone.
      - name: Drop the development tag
        run: |
          aws ecr batch-delete-image \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --image-ids "imageTag=$DEVELOPMENT_TAG"

  deploy-aws-infrastructure:
    needs: promote-backend-artifact
    if: github.event.pull_request.merged == true
    # Skipped if PR is not merged
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Must stay identical to RELEASE_TAG in the promotion job above, which is
      # the tag that job put on the image.
      #
      # The tip of the merged branch, not `github.sha` and not
      # `merge_commit_sha`: squashing writes a new commit that no image is
      # tagged with, so either of those would name a tag that never existed.
      - name: Pin image for task definition
        uses: ./.github/actions/pin-image-tag
        with:
          image-tag: "release-${{ github.event.pull_request.head.sha }}"
          directory: terraform/infrastructure

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: apply-upload
        with:
          workspace: ${{ vars.TF_WORKSPACE_PRODUCTION }}
          directory: terraform/infrastructure

      - name: Create apply run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: apply-run
        with:
          workspace: ${{ vars.TF_WORKSPACE_PRODUCTION }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}
      
      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}

      - name: Update PR
        uses: actions/github-script@v9
        id: plan-comment
        env:
          CONCLUSION: ${{ steps.apply.conclusion }}
          RUN_LINK: ${{ steps.apply-run.outputs.run_link }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = [
              `#### HCP Terraform Plan application to Production: ${process.env.CONCLUSION}`,
              `[HCP Terraform Apply](${process.env.RUN_LINK})`,
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  promote-frontend-artifact:
    # Forks never receive secrets, so the promotion would fail rather than be
    # denied. Skipping keeps the run green and the reason explicit. `head.repo`
    # reads as null once a deleted fork is garbage collected, which compares
    # false and therefore also skips.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # Since the frontend is decoupled from the rest of the architecture,
    # I will allow the two to be deployed separately

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
      CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"

      # Masks the workflow-level value, which this job has no use for. `npm ci`
      # runs a great deal of third-party code alongside it otherwise.
      TF_API_TOKEN: ""

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Only to put Wrangler on the path at the version package.json pins.
      # Nothing is built here: promotion reuses the artifact the pull request.
      - name: Install dependencies
        run: npm ci

      - name: Promote final frontend artifact
        env:
          # The tip of the pull request branch, which is what Frontend CI/CD
          # tagged when it uploaded this version.
          #
          # Deliberately neither `github.sha` nor `merge_commit_sha`. Squashing
          # writes a brand new commit, so both of those are SHAs that no version
          # carries and promotion would fail every time.
          VERSION_TAG: "${{ github.event.pull_request.head.sha }}"

          PR_NUMBER: "${{ github.event.pull_request.number }}"
        
        # The @ is the percentage of traffic that is directed to each version.
        # We want an atomic promotion (this is a default made explicit).
        run: |
          npx wrangler versions deploy --version-tag "$VERSION_TAG@100" --yes \
            --message "Squash merge of #$PR_NUMBER"
