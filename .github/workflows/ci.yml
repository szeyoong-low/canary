name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install all dependencies
        run: npm ci
      - name: Format code with prettier
        run: npx prettier . --check
      - name: Lint code with ESLint
        run: npm run lint
      - name: Typescript compiler type check and Vite bundle
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Install all dependencies
        run: uv sync --dev
      - name: Check code formatting with ruff
        run: uv run ruff format --check .
      - name: Lint code with ruff
        run: uv run ruff check .
      - name: Run test suite
        run: uv run pytest

  deploy-backend:
    runs-on: ubuntu-latest
    needs: backend             # only runs if backend lint passes
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway preview
        run: railway up --service canary --environment preview
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_PREVIEW_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
          
      - name: Format Terraform
        run: terraform fmt -check -recursive -diff
        
      - name: Init Terraform
        run: terraform init -backend=false
      
      - name: Validate Terraform
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Init TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint -f compact