name: Tear down development

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions: {}

env:
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_CLOUD_ORGANIZATION: "${{ vars.TF_CLOUD_ORGANIZATION }}"
  PR_NUMBER: "${{ github.event.pull_request.number }}"
  TF_WORKSPACE_DEVELOPMENT_PR: "${{ vars.TF_WORKSPACE_DEV_PREFIX }}${{ github.event.pull_request.number }}"

# Deliberately NOT keyed on github.workflow, unlike the deploy workflow.
# Sharing the group name means a close arriving while a push is still deploying
# queues behind it, rather than racing to destroy what that deploy is creating.
concurrency:
  group: development-pr-${{ github.event.pull_request.number }}

jobs:
  # Since `force_delete = false`, the environment must be cleared of resources
  destroy-development-environment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      # A pull request closed before it ever deployed has no workspace, and asking
      # HCP to destroy a workspace that does not exist is an error that would block
      # the branch deletion below. Absence is a valid state here, not a failure.
      - name: Check workspace existence
        id: workspace-existence
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${TF_API_TOKEN}" \
            "https://app.terraform.io/api/v2/organizations/${TF_CLOUD_ORGANIZATION}/workspaces/${TF_WORKSPACE_DEVELOPMENT_PR}")

          echo "HCP returned ${status} for ${TF_WORKSPACE_DEVELOPMENT_PR}"

          if [ "${status}" = "200" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # No checkout and no upload: a destroy run reuses the configuration version
      # already on the workspace.
      #
      # Attempted twice. AWS releases the load balancer's and the tasks' network
      # interfaces minutes after reporting those resources deleted, and a subnet
      # or security group one still references refuses to go with a
      # DependencyViolation. The time_sleep in teardown.tf waits for the common
      # case; this covers the days AWS is slower than that. A second run starts
      # from whatever the first managed to delete, so it only has the remainder
      # to do.
      - name: Create destroy run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        if: steps.workspace-existence.outputs.exists == 'true'
        id: destroy-run
        continue-on-error: true
        with:
          is_destroy: true
          workspace: ${{ env.TF_WORKSPACE_DEVELOPMENT_PR }}
          message: "Destroy development environment for closed pull request #${{ github.event.pull_request.number }}"

      - name: Apply destroy
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        if: steps.workspace-existence.outputs.exists == 'true' && fromJSON(steps.destroy-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: destroy-apply
        continue-on-error: true
        with:
          run: ${{ steps.destroy-run.outputs.run_id }}

      - name: Create destroy run (retry)
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        if: steps.workspace-existence.outputs.exists == 'true' && steps.destroy-apply.outcome != 'success'
        id: retry-run
        continue-on-error: true
        with:
          is_destroy: true
          workspace: ${{ env.TF_WORKSPACE_DEVELOPMENT_PR }}
          message: "Retry destroy for closed pull request #${{ github.event.pull_request.number }}"

      - name: Apply destroy (retry)
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        if: steps.retry-run.outcome == 'success' && fromJSON(steps.retry-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: retry-apply
        continue-on-error: true
        with:
          run: ${{ steps.retry-run.outputs.run_id }}

      # Both attempts run with continue-on-error so the second is reachable, which
      # means nothing has failed the job yet. This is where that is decided, and
      # it must stay ahead of the workspace reconciliation: deleting a workspace
      # whose resources still exist would strand them with no state to destroy
      # them from.
      - name: Check teardown succeeded
        id: teardown-result
        if: always() && steps.workspace-existence.outputs.exists == 'true'
        run: |
          if [ "${{ steps.destroy-apply.outcome }}" = "success" ] \
            || [ "${{ steps.retry-apply.outcome }}" = "success" ]; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          echo "Both destroy attempts failed. The workspace is deliberately left in place so its state still names whatever survived."
          exit 1

      - name: Update PR
        uses: actions/github-script@v9
        if: always()
        env:
          PR_NUMBER: ${{ env.PR_NUMBER }}
          WORKSPACE_EXISTS: ${{ steps.workspace-existence.outputs.exists }}
          CONCLUSION: ${{ steps.teardown-result.outputs.conclusion }}
          RUN_LINK: ${{ steps.retry-run.outputs.run_link || steps.destroy-run.outputs.run_link }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = process.env.WORKSPACE_EXISTS === 'true'
              ? [
                  `#### Development environment teardown: ${process.env.CONCLUSION}`,
                  `[HCP Terraform Destroy](${process.env.RUN_LINK})`,
                ].join("\n")
              : [
                  "#### Development environment teardown: nothing to destroy",
                  "No workspace existed for this pull request.",
                ].join("\n");

            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

  # The now-empty workspace drops out of the open pull request list, so
  # reconciling can delete it.
  reconcile-ephemeral-workspaces:
    # A called workflow can only downgrade the caller's permissions, never escalate.
    # These must therefore cover what reconcile-workspaces.yml asks for.
    permissions:
      contents: read
      pull-requests: write

    needs: destroy-development-environment
    uses: ./.github/workflows/reconcile-workspaces.yml
    secrets:
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
    with:
      pull_request_number: ${{ github.event.pull_request.number }}

  # Triggering it as an Action means it can run on closed PRs as well as merged
  # ones, and be run conditionally on teardown success
  delete-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    needs: reconcile-ephemeral-workspaces

    # A fork's branch lives in someone else's repository and is not ours to delete.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Delete branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/git/refs/heads/${BRANCH}" \
            || echo "Branch ${BRANCH} already gone."
