name: Plan production
# Adapted from https://developer.hashicorp.com/terraform/tutorials/automation/github-actions

on:
  pull_request:
    branches:
      - main

permissions: {}

env:
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_CLOUD_ORGANIZATION: "${{ vars.TF_CLOUD_ORGANIZATION }}"
  BOT_COMMENT_TITLE: "HCP Terraform Plan Output: Production"
  BOT_NAME: Bot

concurrency:
  group: ${{ vars.TF_WORKSPACE_PRODUCTION }}
  queue: max

jobs:
  plan-production:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Must stay identical to the tag deploy-production.yml pins, so that this
      # plan previews the task definition the merge will actually apply. The
      # image itself is only created on merge, which plan never checks.
      - name: Pin image for task definition
        uses: ./.github/actions/pin-image-tag
        with:
          image-tag: "release-${{ github.event.pull_request.head.sha }}"
          directory: ${{ vars.TF_DIRECTORY_INFRASTRUCTURE }}

      - name: Upload configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: plan-upload
        with:
          workspace: ${{ vars.TF_WORKSPACE_PRODUCTION }}
          directory: ${{ vars.TF_DIRECTORY_INFRASTRUCTURE }}
          speculative: true

      - name: Create plan run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: plan-run
        with:
          workspace: ${{ vars.TF_WORKSPACE_PRODUCTION }}
          configuration_version: ${{ steps.plan-upload.outputs.configuration_version_id }}
          plan_only: true
      
      - name: Get plan output
        uses: hashicorp/tfc-workflows-github/actions/plan-output@v1.3.2
        id: plan-output
        with:
          plan: ${{ fromJSON(steps.plan-run.outputs.payload).data.relationships.plan.data.id }}

      - name: Update PR
        uses: actions/github-script@v9
        id: plan-comment
        env:
          RESOURCES_ADDED: ${{ steps.plan-output.outputs.add }}
          RESOURCES_CHANGED: ${{ steps.plan-output.outputs.change }}
          RESOURCES_DESTROYED: ${{ steps.plan-output.outputs.destroy }}
          RUN_LINK: ${{ steps.plan-run.outputs.run_link }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment => {
              return comment.user.type === process.env.BOT_NAME && comment.body.includes(process.env.BOT_COMMENT_TITLE)
            });

            // Delete previous comment so PR timeline makes sense
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }

            const { RESOURCES_ADDED, RESOURCES_CHANGED, RESOURCES_DESTROYED } =
              process.env;

            const output = [
              `#### ${process.env.BOT_COMMENT_TITLE}`,
              "```",
              `Plan: ${RESOURCES_ADDED} to add, ${RESOURCES_CHANGED} to change, ${RESOURCES_DESTROYED} to destroy.`,
              "```",
              `[HCP Terraform Plan](${process.env.RUN_LINK})`,
            ].join("\n");

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });