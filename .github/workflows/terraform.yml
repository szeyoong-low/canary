name: Terraform CI

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  terraform-code-scanning:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/infrastructure
          - terraform/bootstrap
          - terraform/global
          - terraform/workspace-manager

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    # One TFLint config is shared by every root module. TFLint only looks for
    # .tflint.hcl in the working directory, which is the matrix directory, so
    # the shared file one level up has to be pointed at explicitly.
    env:
      TFLINT_CONFIG_FILE: ${{ github.workspace }}/terraform/.tflint.hcl
    
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
          
      - name: Format Terraform
        run: terraform fmt -check -recursive -diff
        
      - name: Initialise Terraform
        run: terraform init -backend=false
      
      - name: Validate Terraform
        run: terraform validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
          cache: true

      - name: Initialise TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Lint check (TFLint)
        run: tflint -f compact