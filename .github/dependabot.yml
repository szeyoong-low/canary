version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 5

  - package-ecosystem: terraform
    directory: /infrastructure
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      infrastructure-minor-patch:
        update-types:
          - minor
          - patch
