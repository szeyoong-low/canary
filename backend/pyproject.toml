[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "coloraide>=8.10",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.140.13",
    "langchain>=1.3.14",
    "langchain-openrouter>=0.2.7",
    "langgraph>=1.2.9",
    "polars>=1.42.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
