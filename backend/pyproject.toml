[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.103",
    "coloraide>=8.12.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "langchain>=1.4.2",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.12",
    "polars>=1.44.2",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
