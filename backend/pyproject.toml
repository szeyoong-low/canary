[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.43.121",
    "coloraide>=8.13.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "langchain>=1.4.7",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.18",
    "polars>=1.44.2",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
