[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "coloraide>=8.12.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "langchain>=1.3.18",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.10",
    "polars>=1.44.1",
    "sqlalchemy[asyncio]>=2.0.52",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
