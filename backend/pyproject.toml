[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "coloraide>=8.11.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "langchain>=1.3.15",
    "langchain-openrouter>=0.2.8",
    "langgraph>=1.2.10",
    "polars>=1.43.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
